name: Build Mod Menu

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Build Module
      run: |
        cd app/src/main/jni
        $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk

    - name: Find .so files
      run: |
        echo "Searching for .so files:"
        find app/src/main -name "*.so"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libmodmenu
        path: "**/*.so"